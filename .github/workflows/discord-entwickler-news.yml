name: Discord Entwickler-News

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  discord-entwickler-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Entwickler-News an Discord senden
        env:
          NEWS_MODE: developer
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
        run: node tools/discord-news.mjs
