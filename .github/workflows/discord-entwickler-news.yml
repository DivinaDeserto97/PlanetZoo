name: Discord Entwickler-News

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  discord-entwickler-news:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Entwickler-News als Discord-Bot senden
        env:
          NEWS_MODE: developer
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1555332539982417991'
        run: node tools/discord-news.mjs
