name: Discord Main-Update

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discord-main-update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Main-Update als Discord-Bot senden
        env:
          NEWS_MODE: main
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: '1555169124487929977'
        run: node tools/discord-news.mjs
