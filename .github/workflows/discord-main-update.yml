name: Discord Main-Update

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discord-main-update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Main-Update an Discord senden
        env:
          NEWS_MODE: main
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
        run: node tools/discord-news.mjs
