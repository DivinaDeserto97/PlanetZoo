<header class="header-pc">
  <!-- ================================= -->
  <!-- OBERE ZEILE                       -->
  <!-- ================================= -->

  <div class="header-pc__top">
    <!-- Titel -->
    <div class="header-pc__title">PlanetZoo2</div>

    <!-- Rechte Seite -->
    <div class="header-pc__actions">
      <!-- Sprache -->
      <select
        class="header-pc__language"
        data-language-select
        aria-label="Sprache auswählen"
      >
        <option
          value="de"
          data-i18n
          data-de="Deutsch (Deutsch)"
          data-en="Deutsch (German)"
          data-fr="Deutsch (Allemand)"
        >
          Deutsch (Deutsch)
        </option>

        <option
          value="en"
          data-i18n
          data-de="English (Englisch)"
          data-en="English (English)"
          data-fr="English (Anglais)"
        >
          English (Englisch)
        </option>

        <option
          value="fr"
          data-i18n
          data-de="French (Französisch)"
          data-en="French (French)"
          data-fr="French (Français)"
        >
          French (Französisch)
        </option>
      </select>

      <!-- Dark / Light -->
      <button class="header-pc__theme" type="button" data-theme-toggle>
        Dark / Light
      </button>
    </div>
  </div>

  <!-- ================================= -->
  <!-- UNTERE ZEILE / NAVIGATION         -->
  <!-- ================================= -->

  <nav class="header-pc__nav" data-main-navigation></nav>
</header>
