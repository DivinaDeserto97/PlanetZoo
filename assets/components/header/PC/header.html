<header class="header-pc">
  <!-- ================================= -->
  <!-- OBERE ZEILE                       -->
  <!-- ================================= -->

  <div class="header-pc__top">
    <!-- Titel -->

    <a class="header-pc__title" href="#home" data-page="home" data-header-title>
      Home
    </a>

    <!-- Rechte Seite -->

    <div class="header-pc__actions">
      <!-- Sprache -->

      <select
        class="header-pc__language"
        data-language-select
        aria-label="Sprache auswählen"
      >
        <option
          value="de"
          data-i18n
          data-de="Deutsch (Deutsch)"
          data-en="German (Deutsch)"
          data-fr="Allemand (Deutsch)"
        >
          Deutsch (Deutsch)
        </option>

        <option
          value="en"
          data-i18n
          data-de="Englisch (English)"
          data-en="English (English)"
          data-fr="Anglais (English)"
        >
          Englisch (English)
        </option>

        <option
          value="fr"
          data-i18n
          data-de="Französisch (Français)"
          data-en="French (Français)"
          data-fr="Français (Français)"
        >
          Französisch (Français)
        </option>
      </select>

      <!-- Dark / Light -->

      <button class="header-pc__theme" type="button" data-theme-toggle>
        <span class="header-pc__theme-icon" data-theme-icon aria-hidden="true">
          ☾
        </span>

        <span data-theme-label> Dunkel </span>
      </button>
    </div>
  </div>

  <!-- ================================= -->
  <!-- NAVIGATION                        -->
  <!-- ================================= -->

  <nav class="header-pc__nav" data-main-navigation></nav>
</header>
