<section class="map-page">
  <!-- ================================= -->
  <!-- LINKE SEITE                       -->
  <!-- ================================= -->

  <aside class="map-sidebar">
    <!-- ============================= -->
    <!-- TITEL                         -->
    <!-- ============================= -->

    <div class="map-sidebar__header">
      <h2
        data-i18n
        data-de="Tierkarten"
        data-en="Animal maps"
        data-fr="Cartes des animaux"
      >
        Tierkarten
      </h2>

      <span class="map-sidebar__count">
        <span data-animal-count> 0 </span>

        <span data-i18n data-de=" Tiere" data-en=" animals" data-fr=" animaux">
          Tiere
        </span>
      </span>
    </div>

    <!-- ============================= -->
    <!-- FILTER MEGAMENÜ                -->
    <!-- ============================= -->

    <details class="map-filter" data-map-filter>
      <summary>
        <span data-i18n data-de="Filter" data-en="Filter" data-fr="Filtres">
          Filter
        </span>

        <span class="map-filter__arrow"> ▼ </span>
      </summary>

      <div class="map-filter__content">
        <!-- Suche -->

        <label class="map-filter__field">
          <span
            data-i18n
            data-de="Tier suchen"
            data-en="Search animal"
            data-fr="Rechercher un animal"
          >
            Tier suchen
          </span>

          <input
            type="search"
            data-animal-search
            data-placeholder-de="Name oder wissenschaftlicher Name"
            data-placeholder-en="Name or scientific name"
            data-placeholder-fr="Nom ou nom scientifique"
            placeholder="Name oder wissenschaftlicher Name"
          />
        </label>

        <!-- Nur ausgewählte -->

        <label class="map-filter__checkbox">
          <input type="checkbox" data-filter-selected />

          <span
            data-i18n
            data-de="Nur ausgewählte Tiere"
            data-en="Selected animals only"
            data-fr="Uniquement les animaux sélectionnés"
          >
            Nur ausgewählte Tiere
          </span>
        </label>

        <!-- Filter zurücksetzen -->

        <button
          type="button"
          data-filter-reset
          data-i18n
          data-de="Filter zurücksetzen"
          data-en="Reset filter"
          data-fr="Réinitialiser les filtres"
        >
          Filter zurücksetzen
        </button>
      </div>
    </details>

    <!-- ============================= -->
    <!-- TIERLISTE                     -->
    <!-- ============================= -->

    <div class="map-animal-list" data-animal-list></div>

    <!-- ============================= -->
    <!-- ALLE EIN / ALLE AUS            -->
    <!-- ============================= -->

    <div class="map-animal-actions">
      <button
        type="button"
        data-select-all
        data-i18n
        data-de="Alle ein"
        data-en="Select all"
        data-fr="Tout activer"
      >
        Alle ein
      </button>

      <button
        type="button"
        data-select-none
        data-i18n
        data-de="Alle aus"
        data-en="Select none"
        data-fr="Tout désactiver"
      >
        Alle aus
      </button>
    </div>

    <!-- ============================= -->
    <!-- LEGENDE                       -->
    <!-- immer unten                   -->
    <!-- ============================= -->

    <footer class="map-legend">
      <strong
        data-i18n
        data-de="Darstellung:"
        data-en="Display:"
        data-fr="Affichage :"
      >
        Darstellung:
      </strong>

      <span
        data-i18n
        data-de="Eine Tierart = farbige Fläche"
        data-en="One species = coloured area"
        data-fr="Une espèce = zone colorée"
      >
        Eine Tierart = farbige Fläche
      </span>

      <span
        data-i18n
        data-de="Zwei Tierarten = diagonale Schraffur"
        data-en="Two species = diagonal hatching"
        data-fr="Deux espèces = hachures diagonales"
      >
        Zwei Tierarten = diagonale Schraffur
      </span>

      <span
        data-i18n
        data-de="Drei oder mehr = Kreuzschraffur"
        data-en="Three or more = cross-hatching"
        data-fr="Trois ou plus = hachures croisées"
      >
        Drei oder mehr = Kreuzschraffur
      </span>
    </footer>
  </aside>

  <!-- ================================= -->
  <!-- RECHTE SEITE / WELTKARTE          -->
  <!-- ================================= -->

  <section class="map-main">
    <!-- ============================= -->
    <!-- KARTENKOPF                    -->
    <!-- ============================= -->

    <div class="map-main__header">
      <h1
        data-i18n
        data-de="Gemeinsame Weltkarte"
        data-en="Combined world map"
        data-fr="Carte du monde commune"
      >
        Gemeinsame Weltkarte
      </h1>

      <span class="map-main__status" data-map-status>
        Karte wird geladen …
      </span>
    </div>

    <!-- ============================= -->
    <!-- WELTKARTE                     -->
    <!-- ============================= -->

    <div class="map-stage">
      <svg
        class="map-svg"
        data-map-svg
        viewBox="0 0 540 267"
        role="img"
        aria-label="Gemeinsame Weltkarte"
      >
        <defs>
          <clipPath id="map-world-clip">
            <rect x="0" y="0" width="540" height="267"></rect>
          </clipPath>
        </defs>

        <!--
            Alles innerhalb dieses Bereichs
            wird gemeinsam gezoomt und verschoben.
        -->

        <g clip-path="url(#map-world-clip)">
          <g data-map-viewport>
            <!-- ===================== -->
            <!-- SAUBERE BASISKARTE    -->
            <!-- ===================== -->

            <image
              data-world-base
              x="0"
              y="0"
              width="540"
              height="267"
              preserveAspectRatio="none"
            ></image>

            <!-- ===================== -->
            <!-- TIERGEBIETE           -->
            <!-- ===================== -->

            <image
              data-range-layer
              x="0"
              y="0"
              width="540"
              height="267"
              preserveAspectRatio="none"
            ></image>
          </g>
        </g>
      </svg>
    </div>

    <!-- ============================= -->
    <!-- HOVER INFORMATION             -->
    <!-- ============================= -->

    <div class="map-hover-info" data-map-hover-info>
      <span
        data-i18n
        data-de="Fahre mit der Maus über die Karte."
        data-en="Move the mouse over the map."
        data-fr="Passez la souris sur la carte."
      >
        Fahre mit der Maus über die Karte.
      </span>
    </div>
  </section>
</section>
