<section
  class="nahrungsnetz-page"
  data-nahrungsnetz-page
>
  <header class="nahrungsnetz-header">
    <div>
      <p
        class="nahrungsnetz-header__eyebrow"
        data-i18n
        data-de="ÖKOSYSTEM"
        data-en="ECOSYSTEM"
        data-en-US="ECOSYSTEM"
      >
        ÖKOSYSTEM
      </p>

      <h1
        data-i18n
        data-de="Nahrungsnetz"
        data-en="Food web"
        data-en-US="Food web"
      >
        Nahrungsnetz
      </h1>

      <p
        class="nahrungsnetz-header__description"
        data-i18n
        data-de="Alle Kästchen liegen auf einem X/Y-Raster. Verschieben rastet automatisch auf 20 Pixel ein. Linien werden rechtwinklig über drei feste, verschiebbare Snap-Punkte geführt."
        data-en="All boxes are placed on an X/Y grid. Dragging automatically snaps to 20 pixels. Connections are routed at right angles through three movable snap points."
        data-en-US="All boxes are placed on an X/Y grid. Dragging automatically snaps to 20 pixels. Connections are routed at right angles through three movable snap points."
      >
        Alle Kästchen liegen auf einem X/Y-Raster.
      </p>
    </div>

    <div class="nahrungsnetz-header__stats">
      <span>
        <strong data-nahrungsnetz-animal-count>0</strong>
        <span> Tiere</span>
      </span>

      <span>
        <strong data-nahrungsnetz-node-count>0</strong>
        <span> Knoten</span>
      </span>

      <span>
        <strong data-nahrungsnetz-edge-count>0</strong>
        <span> Verbindungen</span>
      </span>

      <span>
        <strong>20 px</strong>
        <span> Raster</span>
      </span>
    </div>
  </header>

  <section class="nahrungsnetz-toolbar">
    <div class="nahrungsnetz-legend">
      <strong>Linien:</strong>

      <span class="nahrungsnetz-legend__item">
        <i class="nahrungsnetz-legend__line nahrungsnetz-legend__line--direct"></i>
        Direkt
      </span>

      <span class="nahrungsnetz-legend__item">
        <i class="nahrungsnetz-legend__line nahrungsnetz-legend__line--conditional"></i>
        Bedingung / Jungtier
      </span>

      <span class="nahrungsnetz-legend__item">
        <i class="nahrungsnetz-legend__line nahrungsnetz-legend__line--carrion"></i>
        Aas
      </span>

      <span class="nahrungsnetz-save-status" data-graph-save-status>
        Layout gespeichert
      </span>
    </div>

    <div class="nahrungsnetz-toolbar__actions">
      <button type="button" data-graph-center>
        Auswahl zentrieren
      </button>

      <button type="button" data-graph-edit-lines>
        <span data-graph-edit-lines-text>
          Linien bearbeiten
        </span>
      </button>

      <button type="button" data-graph-save>
        Speichern
      </button>

      <button type="button" data-graph-reset>
        Zurücksetzen
      </button>
    </div>
  </section>

  <div
    class="nahrungsnetz-empty"
    data-nahrungsnetz-empty
    hidden
  >
    <strong>Keine Tiere ausgewählt.</strong>
    <p>
      Wähle auf Home mindestens ein Tier aus.
    </p>

    <a href="#home" data-page="home">
      ← Home
    </a>
  </div>

  <section
    class="nahrungsnetz-graph"
    data-nahrungsnetz-graph
  >
    <div class="nahrungsnetz-axis nahrungsnetz-axis--x">
      X →
    </div>

    <div class="nahrungsnetz-axis nahrungsnetz-axis--y">
      Y ↓
    </div>

    <div
      class="graph-scroll"
      data-graph-scroll
    >
      <div
        class="graph-stage"
        data-graph-stage
      >
        <svg
          class="graph-connections"
          data-graph-connections
          aria-hidden="true"
        ></svg>

        <div
          class="graph-route-points"
          data-graph-route-points
        ></div>

        <div
          class="graph-nodes"
          data-graph-nodes
        ></div>
      </div>
    </div>
  </section>
</section>
